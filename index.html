<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Portal de Jogos</title>
    <link rel="stylesheet" href="./portal.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Portal interativo</p>
        <h1>Jogo da Cobrinha</h1>
        <p class="lead">
          Uma tela de entrada para o jogador começar rápido ou ver uma prévia do jogo.
        </p>

        <div class="actions">
          <a id="playLink" class="btn primary" href="./jogo.html">Jogar agora</a>
        </div>

        <div class="meta">
          <div>
            <span>Modo</span>
            <strong>Desktop e mobile</strong>
          </div>
          <div>
            <span>Status</span>
            <strong id="statusText">Pronto para jogar</strong>
          </div>
        </div>
      </section>

      <section class="previewCard">
        <div class="previewTop">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
          <span>Prévia do jogo</span>
        </div>
        <div class="previewBody">
          <iframe
            id="gameFrame"
            title="Prévia do Jogo da Cobrinha"
            src="./jogo.html"
            loading="lazy"
            allow="fullscreen"
          ></iframe>
        </div>
      </section>
    </main>
    <script src="./portal.js"></script>
  </body>
</html>
